name = "mnemorisk-analytics"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

# Activate a custom domain only after the data-controller and
# international-transfer review. Do not route the apex domain.
# [[routes]]
# pattern = "analytics.mnemorisk.org"
# custom_domain = true

[triggers]
crons = ["20 0 * * *", "15 7 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mnemorisk-analytics"
database_id = "13b06076-f03c-498d-a0b9-14d10f315ea8"
migrations_dir = "migrations"

# Keep sending disabled until verified in Cloudflare and migration applied.
[vars]
REPORTS_ENABLED = "false"

# Email binding is intentionally omitted until sender domain and recipient
# are verified in Cloudflare Email Service. REPORTS_ENABLED remains false.
