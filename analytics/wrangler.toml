name = "mnemorisk-analytics"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

# Activate a custom domain only after the data-controller and
# international-transfer review. Do not route the apex domain.
# [[routes]]
# pattern = "analytics.mnemorisk.org"
# custom_domain = true

[triggers]
crons = ["20 0 * * *", "15 7 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mnemorisk-analytics"
database_id = "13b06076-f03c-498d-a0b9-14d10f315ea8"
migrations_dir = "migrations"

# Analytics is gated in the browser by active opt-in; provider transfer review remains a separate compliance requirement.
[vars]
REPORTS_ENABLED = "true"
COLLECTION_ENABLED = "true"
DASHBOARD_ENABLED = "true"
ARCHIVE_ENABLED = "true"

# Sender domain and destination address verified in Cloudflare.
# E-mail reporting activates after collection produces daily summaries.

[[send_email]]
name = "EMAIL"
destination_address = "akin.bakioglu@erzincan.edu.tr"
allowed_sender_addresses = ["reports@mnemorisk.org"]

# Monthly archives use a private GitHub repository instead of paid R2.
# Set GITHUB_ARCHIVE_TOKEN as a Cloudflare Secret scoped only to
# akinbakioglu-ai/mnemorisk-analytics-archive (Contents read/write).
# Archive requires the private target repository and scoped GITHUB_ARCHIVE_TOKEN.

# Dashboard is protected by a strong DASHBOARD_SECRET (Basic auth). A
# separate Cloudflare Access policy may be added later for stronger protection.
