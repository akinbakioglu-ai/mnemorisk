name = "mnemorisk-analytics"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

# Activate a custom domain only after the data-controller and
# international-transfer review. Do not route the apex domain.
# [[routes]]
# pattern = "analytics.mnemorisk.org"
# custom_domain = true

[triggers]
crons = ["20 0 * * *", "15 7 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mnemorisk-analytics"
database_id = "13b06076-f03c-498d-a0b9-14d10f315ea8"
migrations_dir = "migrations"

# Keep sending disabled until verified in Cloudflare and migration applied.
[vars]
REPORTS_ENABLED = "false"
COLLECTION_ENABLED = "false"
DASHBOARD_ENABLED = "true"
ARCHIVE_ENABLED = "false"

# Sender domain and destination address verified in Cloudflare.
# Automated report delivery stays disabled until deliberate activation.

[[send_email]]
name = "EMAIL"
destination_address = "akin.bakioglu@erzincan.edu.tr"
allowed_sender_addresses = ["reports@mnemorisk.org"]

# When the private R2 bucket has been created, uncomment the binding.
# [[r2_buckets]]
# binding = "ARCHIVE"
# bucket_name = "mnemorisk-private-archive"

# Dashboard must remain disabled until DASHBOARD_SECRET exists and
# the stats.mnemorisk.org hostname is protected by Cloudflare Access.
# The code additionally requires an independent Basic-auth secret.
